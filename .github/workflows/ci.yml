name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-none
      - run: cargo xtask ci

  freebsd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          # The pkg toolchain has no x86_64-unknown-none standard library,
          # which the ABI test kernel needs, so install through rustup.
          prepare: |
            pkg install -y rustup-init
            rustup-init -y --profile minimal -c clippy -t x86_64-unknown-none
          run: |
            . "$HOME/.cargo/env"
            cargo xtask ci
